services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Dedicated local-only MongoDB storage. This is never the Render/Atlas database.
      - mongodb_local_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: omkaartehckie/eduai-suite:${BACKEND_IMAGE_TAG:-development}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Keep this fixed: local Docker must never inherit the Atlas URL from .env.
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB: eduai_suite_local
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AUTH_PROVIDER: supabase
      STORAGE_PROVIDER: supabase
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_AUTH_ISSUER: ${SUPABASE_AUTH_ISSUER:-}
      SUPABASE_AUTH_AUDIENCE: ${SUPABASE_AUTH_AUDIENCE:-authenticated}
      SUPABASE_AUTH_JWKS_URL: ${SUPABASE_AUTH_JWKS_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-edui-presentations}
      SUPABASE_MAX_FILE_SIZE_BYTES: ${SUPABASE_MAX_FILE_SIZE_BYTES:-47185920}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TEACHER_EMAIL_DOMAIN: ${TEACHER_EMAIL_DOMAIN:-university.in}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@eduai.suite}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_local_uploads:/app/local_uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 10

  teacherbuddy:
    build:
      context: ./apps/teacherbuddy
      dockerfile: Dockerfile
    env_file:
      - ./apps/teacherbuddy/.env
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  edugames:
    build:
      context: ./apps/edugames
      dockerfile: Dockerfile
    env_file:
      - ./apps/edugames/.env
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5174:5174"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_local_data:
  backend_uploads:
  backend_local_uploads:
