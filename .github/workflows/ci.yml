name: EduAI Suite CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci can omit Rolldown's Linux optional binding when the lockfile
      # was generated on Windows. Let npm resolve platform-native optionals.
      - run: npm install --include=optional
      - run: npm run test:teacherbuddy
      - run: npm run test:edugames
      - run: npm run build -w @eduai/teacherbuddy
      - run: npm run build -w @eduai/edugames

  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest -c pytest.ini tests
        working-directory: backend
