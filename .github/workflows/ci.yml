name: EduAI Suite CI
# workable directory
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      # CI only needs valid-shaped public configuration to compile the client.
      # Production Supabase values are supplied by the deployment environment.
      VITE_SUPABASE_URL: https://ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm ci may omit this native optional package when the lockfile was
      # generated on Windows. Install the locked Linux binding explicitly.
      - run: npm install --no-save --package-lock=false --include=optional --legacy-peer-deps @rolldown/binding-linux-x64-gnu@1.0.0-rc.15
      - run: npm run test:teacherbuddy
      - run: npm run test:edugames
      - run: npm run build -w @eduai/teacherbuddy
      - run: npm run build -w @eduai/edugames

  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest -c pytest.ini tests
        working-directory: backend

  dockerhub:
    needs: [frontend, backend]
    if: github.event_name == 'push' && vars.DOCKERHUB_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: omkaartehckie/eduai-suite
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=development,enable=${{ github.ref == 'refs/heads/development' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
